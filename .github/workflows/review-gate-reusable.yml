name: Review of record (reusable reference)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  review-of-record:
    name: review-of-record
    uses: AI-Ascension/.github/.github/workflows/review-gate.yml@ae781c4be7fda95168e8b880f2826c66f33fb31f
    permissions:
      contents: read
      pull-requests: read
